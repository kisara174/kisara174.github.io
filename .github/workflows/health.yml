name: Website health

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *' # 每天北京时间 11:17

permissions:
  contents: read

concurrency:
  group: website-health
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check live website and preserve outage report
        shell: bash
        run: |
          set +e
          npm run check:health
          result=$?
          if [ "$result" -gt 1 ]; then
            exit "$result"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-health-report
          path: .cache/website-health.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  report:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website-health-report
          path: .cache
      - name: Record changed failures or recovery
        run: node tools/report-health.mjs .cache/website-health.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
