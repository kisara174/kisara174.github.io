# 只覆盖个人需求；默认值来自固定的 hexo-theme-fluid 1.9.9。
# 个人资产放在 source，避免编辑 node_modules。
favicon: /img/fluid0.png
apple_touch_icon: /img/fluid0.png
dark_mode:
  enable: true
  default: auto
color:
  body_bg_color: '#eef1f6'
  body_bg_color_dark: '#111722'
  navbar_text_color: '#243346'
  navbar_text_color_dark: '#e7edf6'
  link_hover_color: '#4168a2'
custom_js: []
custom_css:
  - /css/custom.css
custom_html: ''
navbar:
  blog_title: Kisara
  menu:
    - key: home
      link: /
      icon: iconfont icon-home-fill
    - key: archive
      link: /archives/
      icon: iconfont icon-archive-fill
    - key: tag
      link: /tags/
      icon: iconfont icon-tags-fill
    - key: memos
      link: /memos/
      icon: iconfont icon-comment
footer:
  content: |
    <span>Copyright © 2026 Kisara174</span>
    <a href="https://github.com/kisara174/Kisara" rel="nofollow noopener"><span>Kisara's git</span></a>
index:
  banner_img: /img/eva.jpg
  slogan:
    text: Wir Werden Wissen
post:
  banner_img: /img/eva.jpg
  math:
    enable: true
    specific: false
    engine: mathjax
  comments:
    enable: true
    type: giscus
giscus:
  repo: kisara174/kisara174.github.io
  repo-id: R_kgDOQ861wQ
  category: Announcements
  category-id: DIC_kwDOQ861wc4C1Q0d
  theme-light: light
  theme-dark: dark
  mapping: pathname
  reactions-enabled: 1
  emit-metadata: 0
  input-position: top
  lang: zh-CN
archive:
  banner_img: /img/eva.jpg
category:
  banner_img: /img/eva.jpg
tag:
  banner_img: /img/eva.jpg
page:
  banner_img: /img/eva.jpg
page404:
  banner_img: /img/eva.jpg
links:
  banner_img: /img/eva.jpg
  items:
    - title: Fluid Blog
      intro: 主题博客
      link: https://hexo.fluid-dev.com/
      avatar: /img/fluid0.png
    - title: Fluid Docs
      intro: 主题使用指南
      link: https://hexo.fluid-dev.com/docs/
      avatar: /img/fluid0.png
    - title: Fluid Repo
      intro: 主题 GitHub 仓库
      link: https://github.com/fluid-dev/hexo-theme-fluid
      avatar: /img/fluid0.png
fun_features:
